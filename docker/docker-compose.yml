version: '3.8'

services:
  # 1. PostgreSQL Production Database
  postgres:
    image: postgres:15-alpine
    container_name: road_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: road_intelligence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Message Broker & Cache
  redis:
    image: redis:7-alpine
    container_name: road_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. FastAPI Backend Server
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: road_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/road_intelligence
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=anthropic/claude-3.5-sonnet
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-production-random-secret-key-salt-9823472}
    ports:
      - "8000:8000"
    volumes:
      - ../backend/storage:/app/storage
      - ../backend/models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Celery Distributed Background Worker
  celery_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: road_celery_worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info --concurrency=2
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/road_intelligence
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=anthropic/claude-3.5-sonnet
    volumes:
      - ../backend/storage:/app/storage
      - ../backend/models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 5. React Vite Frontend (Nginx Production Serve)
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: road_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
